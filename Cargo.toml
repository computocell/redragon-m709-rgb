[workspace]
resolver = "2"
members = [
    "crates/m709-core",
    "crates/m709-usb",
    "crates/m709-cli",
    # "crates/m709-gui", # Descomentar após instalar libgtk-4-dev
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Jefferson <jefferson@local>"]
license = "GPL-3.0-or-later"
repository = "https://github.com/morluto/redragon-mouse"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
rusb = "0.9"
clap = { version = "4.5", features = ["derive"] }
thiserror = "2.0"
anyhow = "1.0"
