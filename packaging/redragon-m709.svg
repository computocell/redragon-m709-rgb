<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2d3d"/>
      <stop offset="50%" stop-color="#181a24"/>
      <stop offset="100%" stop-color="#0f1017"/>
    </linearGradient>
    <linearGradient id="rgbGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0055"/>
      <stop offset="30%" stop-color="#9900ff"/>
      <stop offset="70%" stop-color="#00ffff"/>
      <stop offset="100%" stop-color="#00ff66"/>
    </linearGradient>
    <linearGradient id="redAccent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff3344"/>
      <stop offset="100%" stop-color="#cc0022"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background circle badge -->
  <circle cx="64" cy="64" r="60" fill="#12131a" stroke="#252836" stroke-width="3"/>

  <!-- Mouse body shadow & glow -->
  <path d="M64 16 C44 16 34 32 34 60 C34 90 42 110 64 110 C86 110 94 90 94 60 C94 32 84 16 64 16 Z"
        fill="none" stroke="url(#rgbGlow)" stroke-width="4" filter="url(#glow)" opacity="0.8"/>

  <!-- Mouse outer shell -->
  <path d="M64 18 C46 18 36 34 36 60 C36 88 44 108 64 108 C84 108 92 88 92 60 C92 34 82 18 64 18 Z"
        fill="url(#bodyGrad)" stroke="#3e4359" stroke-width="2"/>

  <!-- Left/Right Click split line -->
  <line x1="64" y1="20" x2="64" y2="52" stroke="#12131a" stroke-width="3"/>
  <line x1="64" y1="20" x2="64" y2="52" stroke="#2e3244" stroke-width="1.5"/>

  <!-- Scroll wheel slot -->
  <rect x="58" y="26" width="12" height="26" rx="6" fill="#0d0e14" stroke="#ff3344" stroke-width="1.5"/>

  <!-- Scroll wheel wheel -->
  <rect x="60" y="30" width="8" height="18" rx="4" fill="#252836"/>
  <line x1="60" y1="34" x2="68" y2="34" stroke="#ff3344" stroke-width="1.5"/>
  <line x1="60" y1="39" x2="68" y2="39" stroke="#ff3344" stroke-width="1.5"/>
  <line x1="60" y1="44" x2="68" y2="44" stroke="#ff3344" stroke-width="1.5"/>

  <!-- DPI button -->
  <polygon points="64,58 60,66 68,66" fill="url(#redAccent)"/>

  <!-- Side RGB lighting strips -->
  <path d="M38 52 Q36 74 44 94" fill="none" stroke="url(#rgbGlow)" stroke-width="3" stroke-linecap="round"/>
  <path d="M90 52 Q92 74 84 94" fill="none" stroke="url(#rgbGlow)" stroke-width="3" stroke-linecap="round"/>

  <!-- Side thumb buttons (left side) -->
  <rect x="33" y="56" width="3" height="12" rx="1.5" fill="#ff3344"/>
  <rect x="33" y="70" width="3" height="12" rx="1.5" fill="#ff3344"/>

  <!-- Redragon emblem stylized polygon on palm -->
  <polygon points="64,80 58,88 62,94 64,92 66,94 70,88" fill="url(#redAccent)" opacity="0.9"/>
  <polygon points="64,84 61,88 64,90 67,88" fill="#ffffff" opacity="0.8"/>
</svg>
